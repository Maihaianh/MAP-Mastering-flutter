name: Build Flutter APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Tạo khung Android rồi chép mã nguồn vào
        run: |
          flutter create --org com.map --project-name map_mastering --platforms=android /tmp/app
          rm -rf /tmp/app/lib && cp -r lib /tmp/app/lib
          cp pubspec.yaml /tmp/app/pubspec.yaml
          sed -i 's/flutter\.minSdkVersion/24/' /tmp/app/android/app/build.gradle* || true
      - name: Build APK
        working-directory: /tmp/app
        run: |
          flutter pub get
          flutter build apk --release --no-shrink --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: MAP-Mastering-flutter-apk
          path: /tmp/app/build/app/outputs/flutter-apk/app-release.apk
